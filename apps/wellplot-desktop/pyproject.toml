[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellplot-desktop"
version = "0.1.0"
description = "WellPlot Desktop — host app on WellLogEngine (example and/or product as it matures)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kevin" }]
dependencies = [
  "PySide6>=6.6",
  "numpy>=1.26",
  "lasio>=0.31",
]

[project.optional-dependencies]
# Optional mapping / fence / composite surfaces (host geoviz packages).
# pyproj is required by the geoviz-backed section tests
# (tests/test_well_section_datum.py / test_well_section_workbench.py).
geoviz = ["pyproj>=3"]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
]

[project.scripts]
wellplot-desktop = "well_log_workstation.main:main"
well-log-workstation = "well_log_workstation.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["well_log_workstation*"]

[tool.setuptools.package-data]
well_log_workstation = [
  "templates/*.json",
  "litho_patterns/*.json",
  "testdata/**/*",
  "packaging/**/*",
  "prototypes/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-q"
