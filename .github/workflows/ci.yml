name: WellLogEngine CI

# Standalone CI for the well-log-engine repository. Mirrors the structure of
# the parent PaleoWorkbench workflow (.github/workflows/well-log-engine.yml)
# so the engine repo can report its own health without depending on the parent
# checkout. The parent workflow additionally exercises the engine as a git
# submodule (submodule init + Windows/MSVC + pinned vcpkg matrix).
#
# Coverage (all Linux/GCC unless noted):
#   - GCC Release, shared OFF and ON, -Werror, full CTest
#   - Clang Debug ASan+UBSan, -Werror, full CTest
#   - dense-curve benchmark with a committed regression baseline + metrics upload
#   - Qt 6.8 Widgets headless/Mesa subset (GPU pixel tests excluded — see below)
#   - Python 3.12/3.13 wheel build + binding smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Shared Ubuntu packages for WELLLOG_BUILD_TEXT (HarfBuzz/FreeType/ICU) + Ninja.
env:
  # Keep Arrow optional in default matrix (no system Arrow on runners).
  WELLLOG_CI_UBUNTU_PKGS: >-
    ninja-build
    pkg-config
    zlib1g-dev
    libharfbuzz-dev
    libfreetype6-dev
    libicu-dev
    xvfb

jobs:
  build-and-test:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The parent workflow keeps the Windows/MSVC leg (shared OFF/ON,
        # Werror documented OFF on MSVC); the standalone CI is the Linux
        # -Werror gate.
        os: [ubuntu-latest]
        shared: ["OFF", "ON"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $WELLLOG_CI_UBUNTU_PKGS

      - name: Configure
        run: >
          cmake -S . -B build/well-log-engine -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWELLLOG_BUILD_TESTS=ON
          -DWELLLOG_BUILD_SHARED=${{ matrix.shared }}
          -DWELLLOG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/well-log-engine --parallel

      - name: Test
        run: ctest --test-dir build/well-log-engine --output-on-failure --parallel 2

  clang-sanitizers:
    name: Ubuntu / Clang / ASan+UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $WELLLOG_CI_UBUNTU_PKGS clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build/well-log-engine-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DWELLLOG_BUILD_TESTS=ON
          -DWELLLOG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/well-log-engine-clang --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: >
          ctest --test-dir build/well-log-engine-clang
          --output-on-failure --parallel 2

  dense-curve-benchmark:
    name: Ubuntu / 500k curve / 4K metrics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $WELLLOG_CI_UBUNTU_PKGS

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure benchmark
        run: >
          cmake -S . -B build/well-log-engine-benchmark -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWELLLOG_BUILD_TESTS=OFF
          -DWELLLOG_BUILD_BENCHMARKS=ON
          -DWELLLOG_BUILD_QT_WIDGETS=ON
          -DWELLLOG_WARNINGS_AS_ERRORS=ON

      - name: Build benchmark
        run: >
          cmake --build build/well-log-engine-benchmark
          --target welllog_dense_curve_benchmark --parallel

      - name: Record structured metrics
        shell: bash
        run: >
          xvfb-run -a
          build/well-log-engine-benchmark/welllog_dense_curve_benchmark
          | tee dense-curve-benchmark.json

      - name: Benchmark regression gate
        # Fails on a significant regression vs benchmarks/baseline/
        # dense-curve-ubuntu-llvmpipe.json (see scripts/ci/benchmark_gate.py).
        run: python3 scripts/ci/benchmark_gate.py dense-curve-benchmark.json

      - name: Upload benchmark metrics
        uses: actions/upload-artifact@v4
        with:
          name: dense-curve-benchmark
          path: dense-curve-benchmark.json

  qt-rendering:
    name: Ubuntu / Qt 6.8 / Mesa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $WELLLOG_CI_UBUNTU_PKGS \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build/well-log-engine-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWELLLOG_BUILD_TESTS=ON
          -DWELLLOG_BUILD_QT_WIDGETS=ON
          -DWELLLOG_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/well-log-engine-qt --parallel

      - name: Test with Mesa
        env:
          # llvmpipe needs an explicit GL 3.3 request on some runner images.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "3.3"
          MESA_GLSL_VERSION_OVERRIDE: "330"
          QT_OPENGL: software
        run: |
          # FBO readback / multi-pass render tests need a fuller GL stack than
          # GHA's software Mesa currently provides (white center pixels). Keep
          # non-GL Qt tests (table model, unavailable context, selection sync)
          # and package-consumer on the critical path; GPU pixel tests are
          # exercised by the dense-curve benchmark smoke and local GPU hosts.
          xvfb-run -a ctest --test-dir build/well-log-engine-qt \
            --output-on-failure --parallel 2 \
            --exclude-regex 'welllog[.]qt-widget$|welllog[.]qt-context-lifecycle-stress'

  python-wheel:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $WELLLOG_CI_UBUNTU_PKGS

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          cache: true

      - name: Install binding toolchain
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            "PySide6==6.11.1" \
            "shiboken6==6.11.1" \
            build \
            "scikit-build-core>=0.11,<0.12"
          python -m pip install \
            --index-url=https://download.qt.io/official_releases/QtForPython/ \
            --trusted-host download.qt.io \
            "shiboken6_generator==6.11.1"

      - name: Build wheel
        shell: bash
        run: python -m build . --wheel --no-isolation --outdir dist

      - name: Install wheel
        shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Smoke test installed wheel
        env:
          QT_QPA_PLATFORM: minimal
        run: python tests/python/wheel_smoke.py

      - name: Test Python embedding contracts
        env:
          QT_QPA_PLATFORM: minimal
        run: python tests/python/test_qt_embedding.py

      # #515/#587 (workbench): the desktop workstation suite is the ONLY
      # end-to-end coverage of the native engine path (WellLogView
      # embedding, multi-well submit, engine SVG/PDF/CGM export, depth-ruler
      # SDK/Desktop parity). Every prior topology ran it with
      # WLWS_DISABLE_ENGINE=1 (or not at all), so all engine-gated tests
      # silently skipped and the native path had zero automated coverage.
      # This leg runs the suite against the just-installed wheel in strict
      # binding-first mode: a broken binding FAILS instead of skipping.
      - name: Desktop workstation suite against the installed wheel
        env:
          QT_QPA_PLATFORM: offscreen
          WLWS_REQUIRE_NATIVE_BINDING: "1"
        run: |
          python -m pip install pytest pytest-qt
          cd apps/wellplot-desktop
          python -m pytest tests -q -p no:cacheprovider             --ignore=tests/test_well_section_datum.py             --ignore=tests/test_well_section_workbench.py             --ignore=tests/test_well_log_workstation_packaging.py
          # The three ignored files import the paleo-workbench parent repo /
          # geoviz packages, which are not available in the engine
          # repository (misplaced parent tests, workbench #734).
